<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Life — Lekcja 2</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <header class="mb-4">
      <p class="text-success fw-semibold">STUDENT LIFE / LEKCJA 2</p>
      <h1 class="display-5 fw-bold">Mój szkolny asystent</h1>
      <p class="text-secondary">Jeden projekt, kolejne możliwości.</p>
    </header>
    <section class="card rounded-4 p-4 mb-4">
      <h2 class="h4 mb-3">Kalkulator sprawdzianu</h2>
      <div class="row g-3">
        <div class="col-sm-6">
        <label class="form-label d-block" for="points">Zdobyte punkty</label>
        <input class="form-control mb-3" id="points" type="number" min="0" step="any">
        </div>
        <div class="col-sm-6">
        <label class="form-label d-block" for="maxPoints">Maksymalna liczba punktów</label>
        <input class="form-control mb-3" id="maxPoints" type="number" min="0" step="any">
        </div>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button class="btn btn-success" onclick="calculateResult('')">Oblicz wynik</button>
        <button class="btn btn-outline-secondary" onclick="clearResult('')">Wyczyść</button>
      </div>
      <p id="result" class="alert alert-light border mt-3 mb-0" aria-live="polite">Wpisz punkty i oblicz wynik.</p>
    </section>
    <footer class="border-top mt-5 pt-3 small text-secondary">HTML · Bootstrap · JavaScript</footer>
  </main>
</body>
</html>
